name: wastewaterbot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 15 * * 1'

jobs:
  run-wastewaterbot:
    runs-on: macOS-latest
    env:
      RTOOT_DEFAULT_TOKEN: ${{ secrets.RTOOT_DEFAULT_TOKEN_WASTEWATER }}
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      
      - uses: r-lib/actions/setup-r@v2
          
      - name: Restore R package cache
        id: cache-r-packages
        uses: actions/cache@v5
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-r-${{ hashFiles('install-packages.R') }}-v2
          restore-keys: |
            ${{ runner.os }}-r-
          
      - name: Install packages
        if: steps.cache-r-packages.outputs.cache-hit != 'true'        
        run: R -e 'source("install-packages.R", echo = TRUE)'
        
      - name: Download Parse and Update Chart Data
        run: Rscript wastewaterbot.R
        
      # Add new files in folder, commit along with other modified files, push
      - name: Commit and push if it changed
        run: |-
          git config user.name "wastewaterbot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          timestamp=$(date -u)
          git commit -m "Latest wastewater data: ${timestamp}" || exit 0
          git push

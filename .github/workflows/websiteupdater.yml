name: websiteupdater

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

jobs:
  run-websiteupdater:
    runs-on: macOS-latest
    env:
      OWM_API_KEY: ${{ secrets.OWM_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      AQI_API_KEY: ${{ secrets.AQI_API_KEY }}
      PIRATE_WEATHER: ${{ secrets.PIRATE_WEATHER }}
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v3
      
      - uses: r-lib/actions/setup-r@v2
          
      - name: Restore R package cache
        id: cache-r-packages
        uses: actions/cache@v3
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-${{ hashFiles('install-packages.R') }}-1
          
      - name: Install packages
        if: steps.cache-r-packages.outputs.cache-hit != 'true'        
        run: R -e 'source("install-packages.R", echo = TRUE)'
        
      - name: Download Parse and Update Data
        run: |-
          Rscript economy.R
          Rscript baseball.R
          Rscript basketball.R
          Rscript weather.R
          Rscript forecasts.R
          Rscript soil.R
          Rscript wastewater.R
        
      # Add new files in folder, commit along with other modified files, push
      - name: Commit and push if it changed
        run: |-
          git config user.name "websiteupdater"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          timestamp=$(date -u)
          git commit -m "Latest data: ${timestamp}" || exit 0
          git push

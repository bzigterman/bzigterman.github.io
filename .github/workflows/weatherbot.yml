name: autoweatherbot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */3 * * *'

jobs:
  run-autoweatherbot:
    runs-on: macOS-latest
    env:
      OWM_API_KEY: ${{ secrets.OWM_API_KEY }}
      AQI_API_KEY: ${{ secrets.AQI_API_KEY }}
      PIRATE_WEATHER: ${{ secrets.PIRATE_WEATHER }}
      RTOOT_DEFAULT_TOKEN: ${{ secrets.RTOOT_DEFAULT_TOKEN }}
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v2
      
      - uses: r-lib/actions/setup-r@v2
          
      - name: Restore R package cache
        id: cache-r-packages
        uses: actions/cache@v2
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-${{ hashFiles('install-packages.R') }}-1
          
      - name: Install packages
        if: steps.cache-r-packages.outputs.cache-hit != 'true'        
        run: |-
          brew install pkg-config
          brew install gdal
          brew install proj
          R -e 'source("install-packages.R", echo = TRUE)'
        
      - name: Download Parse and Update Data
        run: Rscript weatherbot.R
        
      # Add new files in folder, commit along with other modified files, push
      - name: Commit and push if it changed
        run: |-
          git config user.name "autoweatherbot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          timestamp=$(date -u)
          git commit -m "Latest weather data: ${timestamp}" || exit 0
          git push

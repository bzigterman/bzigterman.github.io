name: autocandidates

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */18 * * *'
  push:
    paths:
      - 'candidates.R'
      - 'data/presidential_candidates.csv'

jobs:
  run-autocandidate:
    runs-on: macOS-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      
      - uses: r-lib/actions/setup-r@v2
          
      - name: Restore R package cache
        id: cache-r-packages
        uses: actions/cache@v5
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-r-${{ hashFiles('install-packages.R') }}-v2
          restore-keys: |
            ${{ runner.os }}-r-
          
      - name: Install packages
        if: steps.cache-r-packages.outputs.cache-hit != 'true'        
        run: R -e 'source("install-packages.R", echo = TRUE)'
        
      - name: Download Parse and Update Candidate Data
        run: Rscript candidates.R
        
      # Add new files in folder, commit along with other modified files, push
      - name: Commit and push if it changed
        run: |-
          git config user.name "autocandidates"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          timestamp=$(date -u)
          git commit -m "Latest candidates data: ${timestamp}" || exit 0
          git push

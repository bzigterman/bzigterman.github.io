name: autoweather

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'
  push:
    paths:
      - 'weather.R'

jobs:
  run-autoweather:
    runs-on: macOS-latest
    env:
      TZ: "America/Chicago"
      OWM_API_KEY: ${{ secrets.OWM_API_KEY }}
      AQI_API_KEY: ${{ secrets.AQI_API_KEY }}
      PIRATE_WEATHER: ${{ secrets.PIRATE_WEATHER }}
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      
      - uses: r-lib/actions/setup-r@v2
          
      - name: Restore R package cache
        id: cache-r-packages
        uses: actions/cache@v6
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-r-${{ hashFiles('install-packages.R') }}-v2
          restore-keys: |
            ${{ runner.os }}-r-
          
      - name: Install packages
        if: steps.cache-r-packages.outputs.cache-hit != 'true'        
        run: R -e 'source("install-packages.R", echo = TRUE)'
        
      - name: Download Parse and Update Data
        run: Rscript weather.R
      
      - name: Clean up old weather images
        run: |
          # Keep only the 4 most recent desktop and mobile images, delete the rest
          cd plots
          ls -t weather_*.png | grep -v "_mobile.png" | tail -n +5 | xargs -r rm
          ls -t weather_*_mobile.png | tail -n +5 | xargs -r rm

      # Add new files in folder, commit along with other modified files, push
      - name: Commit and push if it changed
        run: |-
          git config user.name "autoweather"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          timestamp=$(date -u)
          git commit -m "Latest weather data: ${timestamp}" || exit 0
          git push
